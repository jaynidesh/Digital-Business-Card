<main><header>
<img class="sbm_logo" src="assets/images/logo_sbm.png" alt="Logo">    
<div class="intro">
    <h1>Digital contact card</h1>
</div>
</header>
<section class="grid">@for(person of profiles; track person.staffToken){<article>
    <div class="avatar">
        @if (person.photo) {
            <img
              [src]="person.photo"
              [alt]="person.displayName"
            >
          } @else {
            <span>{{ person.initials }}</span>
          }
    </div>
    <div>
        <h2>{{person.displayName}}</h2><p>{{person.jobTitle}}</p><small>{{person.department}}</small></div><nav><a [routerLink]="['/contact',person.publicToken]">Public card</a><a class="staff" [routerLink]="['/staff',person.staffToken]">Staff QR view</a></nav></article>}</section>
    </main>
